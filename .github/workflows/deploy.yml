name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pages เสิร์ฟจาก branch gh-pages — mirror main ไปทุกครั้งที่ push
      - name: Mirror main to gh-pages
        run: git push origin main:gh-pages --force
