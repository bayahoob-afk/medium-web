<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>หาหมอดู — Medium</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔮</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#12081f">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="seers">
  <header class="nav" id="app-nav"></header>

  <section class="section container">
    <div class="section-head">
      <h2>ค้นหา<span class="em">หมอดู</span>ที่ใช่สำหรับคุณ</h2>
      <p>ทุกคนผ่านการยืนยันตัวตน ทุกเซสชันมีคลิปย้อนหลังและสรุปคำทำนายให้เสมอ</p>
    </div>

    <div class="filter-bar">
      <input type="text" id="search" class="search-input" placeholder="🔍 ค้นหาชื่อหมอดู ศาสตร์ หรือความเชี่ยวชาญ...">
      <div id="craft-chips" style="display:flex;gap:8px;flex-wrap:wrap"></div>
    </div>

    <div class="grid grid-3" id="seer-grid"></div>
    <p class="tc muted mt-3" id="no-result" hidden>ไม่พบหมอดูที่ตรงกับการค้นหา ลองเปลี่ยนคำค้นดูนะคะ</p>

    <!-- Fallback: หมอดูทิพย์ เมื่อหมอดูไม่ว่าง/อยากถามทันที -->
    <div class="card mt-3" id="tipya-fallback" style="text-align:center">
      <span class="icon">🕯️</span>
      <h3 id="tipya-title">ไม่อยากรอคิว? ถามหมอดูทิพย์ได้ทันที</h3>
      <p class="muted" id="tipya-sub">ระบบตอบอัตโนมัติที่ศึกษาศาสตร์ความเชื่อจริง เปิดตลอด 24 ชม. ฟรี — ไม่ใช่บุคคลจริง</p>
      <a class="btn btn-purple btn-sm" id="tipya-link" href="medium.html">🕯️ เข้าห้องหมอดูทิพย์ →</a>
    </div>
  </section>

  <footer class="footer" id="app-footer"></footer>

  <!-- Booking Modal -->
  <div class="modal-backdrop" id="booking-modal" hidden>
    <div class="modal">
      <button class="close-x" id="modal-close">✕</button>
      <div id="booking-body"></div>
    </div>
  </div>

  <script src="data/seers.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    const grid = document.getElementById("seer-grid");
    const chipsWrap = document.getElementById("craft-chips");
    const searchEl = document.getElementById("search");
    const noResult = document.getElementById("no-result");
    let activeCraft = "ทั้งหมด";

    // ---------- หมอดูคนโปรด + ประวัติการจอง (localStorage ในเครื่องผู้ใช้เท่านั้น) ----------
    function lsArr(k) { try { return JSON.parse(localStorage.getItem(k)) || []; } catch (e) { return []; } }
    function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
    const favs = () => lsArr("medium_fav_seers");
    const bookedIds = () => lsArr("medium_bookings").map(b => b.seerId);
    function toggleFav(id) {
      const f = favs();
      lsSet("medium_fav_seers", f.includes(id) ? f.filter(x => x !== id) : [...f, id]);
      render();
    }

    // ศาสตร์ → หมอดูทิพย์ประจำศาสตร์ (fallback เมื่อหมอดูไม่ว่าง)
    const CRAFT_PERSONA = {
      "ไพ่ยิปซี": "tarot", "โหราศาสตร์ไทย": "thai-astro", "เลข 7 ตัว 9 ฐาน": "numerology",
      "ลายมือ": "palmistry", "ไพ่ออราเคิล": "oracle", "โหราศาสตร์ยูเรเนียน": "uranian",
      "จิตสัมผัส": "sixth-sense", "ฮวงจุ้ย": "fengshui",
      "ดวงจีน": "chinese-astro", "ซาจูเกาหลี": "saju", "โหราเขมร": "khmer-astro"
    };

    // สร้างชิปฟิลเตอร์จากศาสตร์ที่มีจริงในข้อมูล
    const crafts = ["ทั้งหมด", "❤️ คนโปรด", ...new Set(window.SEERS.map(s => s.craft))];
    chipsWrap.innerHTML = crafts.map(c =>
      `<button class="chip ${c === "ทั้งหมด" ? "active" : ""}" data-craft="${c}">${c}</button>`).join("");
    chipsWrap.addEventListener("click", e => {
      const btn = e.target.closest(".chip");
      if (!btn) return;
      activeCraft = btn.dataset.craft;
      chipsWrap.querySelectorAll(".chip").forEach(x => x.classList.toggle("active", x === btn));
      render();
    });
    searchEl.addEventListener("input", render);

    function render() {
      const q = searchEl.value.trim().toLowerCase();
      const favSet = favs(), bookedSet = bookedIds();
      let list = window.SEERS.filter(s => {
        const matchCraft = activeCraft === "ทั้งหมด" || activeCraft === "❤️ คนโปรด" && favSet.includes(s.id) || s.craft === activeCraft;
        const hay = (s.name + s.craft + s.crafts.join(" ") + s.specialty + s.bio).toLowerCase();
        return matchCraft && (!q || hay.includes(q));
      });
      // คนโปรดขึ้นก่อนเสมอ — ลูกค้าประจำหาเจอไว
      list = [...list].sort((a, b) => favSet.includes(b.id) - favSet.includes(a.id));
      noResult.hidden = list.length > 0;
      grid.innerHTML = list.map(s => `
        <div class="seer-card" id="${s.id}">
          <button class="fav-btn ${favSet.includes(s.id) ? "active" : ""}" data-fav="${s.id}"
            title="หมอดูคนโปรด" aria-label="หมอดูคนโปรด">${favSet.includes(s.id) ? "❤️" : "🤍"}</button>
          <div class="seer-top">
            <div class="avatar">${s.emoji}</div>
            <div>
              <div class="seer-name">${s.name}</div>
              <div class="seer-title">
                ${s.online ? '<span class="online-dot"></span>ออนไลน์' : '<span class="offline-dot"></span>ออฟไลน์'}
                · ${s.exp} ปี${bookedSet.includes(s.id) ? ' · <span class="gold">⭐ เคยจอง</span>' : ""}
              </div>
            </div>
          </div>
          <div class="seer-tags">
            ${s.crafts.map(c => `<span class="badge">${c}</span>`).join("")}
            <span class="badge badge-gold">${s.specialty}</span>
          </div>
          <div class="rating">${starText(s.rating)} ${s.rating} <span class="cnt">(${s.reviews.toLocaleString()} รีวิว)</span></div>
          <p class="muted" style="font-size:.88rem">${s.bio}</p>
          <div class="seer-foot">
            <div class="price"><b>฿${s.pricePerMin}</b> <span>/นาที</span></div>
            <button class="btn btn-gold btn-sm" onclick="openBooking('${s.id}')">จองคิว</button>
          </div>
        </div>`).join("");
      updateTipya(list);
      grid.querySelectorAll("[data-fav]").forEach(b => b.onclick = e => {
        e.stopPropagation();
        toggleFav(b.dataset.fav);
      });
    }

    // ปรับการ์ดหมอดูทิพย์ตามศาสตร์ที่เลือก และเด่นขึ้นเมื่อไม่มีหมอดูออนไลน์
    function updateTipya(list) {
      const pid = CRAFT_PERSONA[activeCraft];
      const link = document.getElementById("tipya-link");
      const title = document.getElementById("tipya-title");
      link.href = pid ? `medium.html#${pid}` : "medium.html";
      const noneOnline = list.length === 0 || list.every(s => !s.online);
      title.textContent = noneOnline
        ? (activeCraft === "ทั้งหมด"
            ? "ตอนนี้หมอดูไม่ว่าง — ถามหมอดูทิพย์ก่อนได้เลย"
            : `หมอดู${activeCraft}ไม่ว่างตอนนี้ — ถามหมอดูทิพย์${activeCraft}ก่อนได้เลย`)
        : (activeCraft === "ทั้งหมด"
            ? "ไม่อยากรอคิว? ถามหมอดูทิพย์ได้ทันที"
            : `ไม่อยากรอคิว? ถามหมอดูทิพย์${activeCraft}ได้ทันที`);
    }
    render();

    // ---------- Booking ----------
    const modal = document.getElementById("booking-modal");
    const body = document.getElementById("booking-body");
    document.getElementById("modal-close").onclick = () => modal.hidden = true;
    modal.addEventListener("click", e => { if (e.target === modal) modal.hidden = true; });

    let currentSeer = null, currentPkg = 30;

    function openBooking(id) {
      currentSeer = window.SEERS.find(s => s.id === id);
      currentPkg = 30;
      const today = new Date().toISOString().split("T")[0];
      body.innerHTML = `
        <h3>จองคิว — ${currentSeer.name}</h3>
        <p class="muted" style="font-size:.9rem">${currentSeer.craft} · ฿${currentSeer.pricePerMin}/นาที</p>
        <div class="form-group">
          <label>เลือกแพ็กเกจเวลา</label>
          <div class="pkg-row">
            ${window.SESSION_PACKAGES.map(m => `
              <button class="pkg ${m === 30 ? "active" : ""}" data-min="${m}">
                <b>${m} นาที</b><small>฿${(m * currentSeer.pricePerMin).toLocaleString()}</small>
              </button>`).join("")}
          </div>
        </div>
        <div class="form-group">
          <label>วันที่</label>
          <input type="date" id="bk-date" min="${today}" value="${today}">
        </div>
        <div class="form-group">
          <label>เวลา</label>
          <select id="bk-time">
            ${["10:00", "11:00", "13:00", "14:30", "16:00", "18:00", "19:30", "21:00"].map(t => `<option>${t}</option>`).join("")}
          </select>
        </div>
        <div class="form-group">
          <label>เรื่องที่อยากถาม (ช่วยให้หมอดูเตรียมตัว)</label>
          <textarea id="bk-topic" rows="2" placeholder="เช่น ความรัก การงาน ดวงปีนี้..."></textarea>
        </div>
        <div class="summary-box" id="bk-summary"></div>
        <button class="btn btn-gold" style="width:100%" id="bk-confirm">💳 ชำระเงินและยืนยันการจอง</button>
        <p class="muted tc" style="font-size:.78rem;margin-top:10px">
          เงินจะพักไว้ในระบบ (escrow) และโอนให้หมอดูหลังจบเซสชันเท่านั้น · ยกเลิกก่อน 24 ชม. คืนเงินเต็มจำนวน
        </p>`;
      body.querySelectorAll(".pkg").forEach(p => p.onclick = () => {
        currentPkg = +p.dataset.min;
        body.querySelectorAll(".pkg").forEach(x => x.classList.toggle("active", x === p));
        renderSummary();
      });
      renderSummary();
      body.querySelector("#bk-confirm").onclick = confirmBooking;
      modal.hidden = false;
    }

    function renderSummary() {
      const price = currentPkg * currentSeer.pricePerMin;
      document.getElementById("bk-summary").innerHTML = `
        <div class="row"><span>แพ็กเกจ ${currentPkg} นาที</span><span>฿${price.toLocaleString()}</span></div>
        <div class="row"><span>🎥 อัดคลิป + 📋 สรุปคำทำนาย</span><span class="gold">ฟรี</span></div>
        <div class="row"><span>ราคารวมทุกอย่างแล้ว ไม่มีค่าใช้จ่ายเพิ่ม</span><span>✓</span></div>
        <div class="row total"><span>ยอดชำระ</span><b>฿${price.toLocaleString()}</b></div>`;
    }

    // สร้างไฟล์ .ics ให้ผู้ใช้เพิ่มนัดลงปฏิทินมือถือ — กันลืมนัดหมอดู
    function downloadIcs(date, time, topic) {
      const [h, m] = time.split(":").map(Number);
      const start = new Date(date + "T" + time + ":00");
      const end = new Date(start.getTime() + currentPkg * 60000);
      const fmt = d => d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0") +
        "T" + String(d.getHours()).padStart(2, "0") + String(d.getMinutes()).padStart(2, "0") + "00";
      const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Medium//TH", "BEGIN:VEVENT",
        "UID:" + Date.now() + "@medium", "DTSTART:" + fmt(start), "DTEND:" + fmt(end),
        "SUMMARY:🔮 นัดดูดวงกับ" + currentSeer.name,
        "DESCRIPTION:เรื่องที่ถาม: " + topic.replace(/[\n,;]/g, " ") + " · เข้าเซสชันที่ " + location.origin + location.pathname.replace(/[^/]*$/, "") + "session.html",
        "BEGIN:VALARM", "TRIGGER:-PT30M", "ACTION:DISPLAY", "DESCRIPTION:อีก 30 นาทีถึงนัดดูดวง", "END:VALARM",
        "END:VEVENT", "END:VCALENDAR"].join("\r\n");
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
      a.download = "medium-booking.ics";
      document.body.appendChild(a); a.click(); a.remove();
    }

    function confirmBooking() {
      const date = body.querySelector("#bk-date").value;
      const time = body.querySelector("#bk-time").value;
      const topic = body.querySelector("#bk-topic").value.trim() || "ดวงโดยรวม";
      // เก็บข้อมูลการจองไว้ให้หน้าเซสชันใช้ (จำลอง backend)
      try {
        sessionStorage.setItem("mediumBooking", JSON.stringify({
          seerId: currentSeer.id, seerName: currentSeer.name, seerEmoji: currentSeer.emoji,
          craft: currentSeer.craft, minutes: currentPkg,
          price: currentPkg * currentSeer.pricePerMin, date, time, topic
        }));
      } catch (e) { /* private mode: ไปต่อได้ หน้าเซสชันมีค่า default */ }
      // ประวัติการจองข้าม session (สำหรับ badge "เคยจอง" และการจองซ้ำ)
      lsSet("medium_bookings", [{ seerId: currentSeer.id, date, time, at: new Date().toISOString() },
        ...lsArr("medium_bookings")].slice(0, 20));
      body.innerHTML = `
        <div class="tc" style="padding:20px 0">
          <div style="font-size:3.4rem">✅</div>
          <h3 class="mt-1">จองคิวสำเร็จ!</h3>
          <p class="muted" style="margin:10px 0">
            ${currentSeer.name} · ${date} เวลา ${time} น. (${currentPkg} นาที)<br>
            เรื่องที่ถาม: ${escapeHtml(topic)}<br>
            เงินของคุณพักไว้ในระบบอย่างปลอดภัยแล้ว
          </p>
          <a href="session.html" class="btn btn-purple mt-2">🎥 เข้าเซสชันเลย (เดโม)</a>
          <button class="btn btn-ghost btn-sm mt-2" id="bk-ics">📅 เพิ่มนัดลงปฏิทิน + เตือนก่อน 30 นาที</button>
          <p class="muted" style="font-size:.85rem;margin-top:14px">
            ระหว่างรอถึงเวลานัด —
            <a href="medium.html${CRAFT_PERSONA[currentSeer.craft] ? "#" + CRAFT_PERSONA[currentSeer.craft] : ""}" class="gold">คุยกับหมอดูทิพย์${currentSeer.craft}ก่อนได้ ฟรี →</a>
          </p>
        </div>`;
      body.querySelector("#bk-ics").onclick = () => downloadIcs(date, time, topic);
      render(); // อัปเดต badge "เคยจอง" บนการ์ดทันที
    }
  </script>
</body>
</html>
